name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The schema conformance tests download the official OMG ReqIF XSD and its
      # imports on first use; the schemas are frozen, so the cache key never changes.
      - name: Cache ReqIF schema
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/reqif-schema
          key: reqif-schema-20110401

      - name: Build and run tests
        env:
          REQIF_SCHEMA_DIR: ${{ runner.temp }}/reqif-schema
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
